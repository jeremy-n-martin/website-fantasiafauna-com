<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fantasia Fauna — prototype de jeu de cartes et aventure dans un monde fantastique.">
  <title>Fantasia Fauna — Arcanes du Bestiaire</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .card-art { display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #1b1820, #050505 70%); }
    .card-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center center; display: block; }
    .art img { width: 100%; height: 100%; object-fit: contain; object-position: center center; }
  </style>
</head>
<body>
  <div id="app" class="app-shell">
    <noscript>Active JavaScript pour jouer au prototype Fantasia Fauna.</noscript>
  </div>
  <script src="game.js"></script>
</body>
</html>

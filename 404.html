<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fantasia Fauna — bestiaire illustré des créatures fantasy, des mythes et des légendes.">
  <meta name="theme-color" content="#0e1520">
  <title>Fantasia Fauna — Bestiaire fantasy</title>
  <link rel="icon" type="image/svg+xml" href="/img/dragon-mark.svg?v=argent1">
  <script src="/js/theme.js?v=themes1"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css?v=arches3">
</head>
<body>
  <a class="skip" href="#app">Aller au contenu</a>
  <header class="site-header">
    <a class="brand" href="/">
      <svg class="mark" aria-hidden="true" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M32 3 57 17v30L32 61 7 47V17Z" opacity=".45"/><path d="m18 43 2-14 8-9-2-9 11 9 10 2-5 7-10 2 6 6-4 10H19l-5-6 9 1 4-7"/><path d="m32 20 3-9 5 10M38 25h3M18 51h28M43 34l7-3-3 8-6 4"/></svg>
      <span class="brand-name">Fantasia Fauna</span>
    </a>
    <nav class="nav-links" aria-label="Navigation principale">
      <a id="nav-catalog" href="/">Catalogue</a>
    </nav>
    <div class="theme-control">
      <label for="theme-range"><svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M15 6a7 7 0 1 0 3 11A7 7 0 0 1 15 6Z"/><g class="sun-rays"><path d="M12 1v2m0 18v2M1 12h2m18 0h2M4 4l2 2m12 12 2 2M4 20l2-2M18 6l2-2"/></g></svg>Thème</label>
      <input id="theme-range" type="range" min="0" max="3" step="1" value="2" aria-valuetext="clair doux">
      <output id="theme-label" for="theme-range">clair doux</output>
    </div>
  </header>

  <noscript>
    <div class="wrap"><p class="undocumented">JavaScript est nécessaire pour consulter le bestiaire.</p></div>
  </noscript>
  <main id="app" class="wrap" tabindex="-1"></main>

  <footer class="site-footer">
    <span>Fantasia Fauna <span class="footer-star" aria-hidden="true">·</span> Bestiaire des créatures fantasy</span>
    <span class="footer-note">Mythes, légendes & mondes imaginaires</span>
  </footer>

  <dialog class="viewer" id="viewer" aria-labelledby="viewer-title">
    <div class="viewer-bar">
      <strong id="viewer-title">Illustration</strong>
      <button class="quiet" type="button" id="viewer-close" autofocus>Fermer</button>
    </div>
    <img id="viewer-image" alt="">
  </dialog>

  <script src="/js/creatures-data.js?v=cabinet3"></script>
  <script src="/js/descriptions.js?v=complete2"></script>
  <script src="/js/notices.js?v=notices2"></script>
  <script src="/js/fiches.js?v=fiches4"></script>
  <script src="/js/app.js?v=arches3"></script>
</body>
</html>

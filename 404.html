<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <a class="skip" href="#app">Aller au contenu</a>

      <radialGradient id="glow-b" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#F1EEE7" stop-opacity="0.16"/>
        <stop offset="100%" stop-color="#F1EEE7" stop-opacity="0"/>
      </radialGradient>
      <filter id="soft">
        <feGaussianBlur stdDeviation="32"/>
      </filter>
    </defs>
    <ellipse class="glow" cx="240" cy="120" rx="280" ry="190" fill="url(#glow-a)" filter="url(#soft)"/>
    <ellipse class="glow glow-b" cx="1220" cy="90" rx="260" ry="180" fill="url(#glow-b)" filter="url(#soft)"/>
    <ellipse class="glow glow-c" cx="900" cy="780" rx="340" ry="170" fill="url(#glow-a)" filter="url(#soft)"/>

      <circle class="star" cx="680" cy="248" r="1.5"/>

      <circle class="star" cx="980" cy="180" r="1.5"/>

      <circle class="star" cx="1180" cy="410" r="1.6"/>

    <path class="horizon" d="M-40 770c200-88 380-36 540-78 210-54 330 18 510-28 170-42 330-8 470 38"/>

      <circle class="spore" cx="1280" cy="120" r="1.6"/>

  <header class="site-header">
    <a class="brand" href="/">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect class="mark-plate" x="3.5" y="3.5" width="25" height="25"/>

        <path class="mark-tick" d="M22 5.2h4.8V10"/>
        <path class="mark-tick" d="M10 26.8H5.2V22"/>
        <path class="mark-tick" d="M22 26.8h4.8V22"/>

        <circle class="mark-core" cx="16" cy="16" r="2.3"/>
      </svg>
      <span class="brand-name">Fantasia Fauna</span>
    </a>
    <nav class="nav-links" aria-label="Navigation principale">
      <a id="nav-catalog" href="/">Catalogue</a>
      <a href="/demo-scenes.html">Scènes</a>
    </nav>

  <main id="app" class="wrap"></main>
